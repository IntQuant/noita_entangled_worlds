name: release

on: [push, pull_request]

jobs:
  build-mod:
    # Only hosts the container below; the build itself runs on debian.
    runs-on: ubuntu-24.04
    # ewext links with the system mingw toolchain, and Rust's windows-gnu targets need at least
    # binutils 2.44, GCC 14.2 and mingw-w64 12.0 (rustc book, platform-support/windows-gnu).
    # Older ones build a DLL whose native TLS crashes when Noita loads it. Debian trixie ships
    # exactly those versions; no GitHub-hosted Ubuntu runner does yet.
    container: debian:trixie
    name: Build mod and ewext
    steps:
      # The container runs as root and has none of the runner image's tools.
      - name: Install build deps
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git zstd python3 gcc libc6-dev gcc-mingw-w64-i686
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-pc-windows-gnu
          # Pinned: rust-lang/rust#159021 (first in nightly-2026-10-03) makes thread_local! use
          # native PE TLS on windows-gnu, and ewext crashes on its first TLS access when Noita
          # loads it. Bump the build step below together with this.
          toolchain: 'nightly-2026-10-02'

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ewext -> target

      - name: Build ewext
        run: |
          rustup component add rust-src --toolchain nightly-2026-10-02-x86_64-unknown-linux-gnu
          cargo +nightly-2026-10-02 build --release --target=i686-pc-windows-gnu
        working-directory: ./ewext
      - name: Copy ewext
        run: cp ewext/target/i686-pc-windows-gnu/release/ewext.dll quant.ew/ewext.dll

      - name: Create archive
        run: python3 scripts/ci_make_archives.py mod

      - uses: actions/upload-artifact@v4
        with:
          name: quant.ew.zip
          path: target/quant.ew.zip

  build-proxy-linux:
    name: Build proxy for linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - name: Install extra deps
        run: sudo apt-get update && sudo apt-get install -y libclang-dev libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev gcc-mingw-w64-i686 gcc-mingw-w64 libasound2-dev libjack-dev

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: noita_proxy -> target

      - name: Build Linux proxy release
        run: cargo build --release
        working-directory: ./noita_proxy
      
      - name: Create archives
        run: python scripts/ci_make_archives.py linux

      - uses: actions/upload-artifact@v4
        with:
          name: noita_proxy-linux.zip
          path: target/noita_proxy-linux.zip

  build-proxy-macos:
    name: Build proxy for macos (${{ matrix.architecture }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            architecture: arm64
            zip_name: noita_proxy-macos-arm64.zip
          - os: macos-15-intel
            architecture: intel
            zip_name: noita_proxy-macos-intel.zip
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: noita_proxy -> target

      - name: Build Macos proxy release
        run: export CMAKE_POLICY_VERSION_MINIMUM=3.5 && cargo build --release
        working-directory: ./noita_proxy

      - name: Create archives
        run: python scripts/ci_make_archives.py macos

      - name: Rename archive
        run: mv target/noita_proxy-macos.zip target/${{ matrix.zip_name }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.zip_name }}
          path: target/${{ matrix.zip_name }}

  build-proxy-windows:
    name: Build proxy for windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: noita_proxy -> target

      - name: Build Windows proxy release
        run: cargo build --release
        working-directory: ./noita_proxy

      - name: Create archives
        run: python scripts/ci_make_archives.py windows

      - uses: actions/upload-artifact@v4
        with:
          name: noita_proxy-win.zip
          path: target/noita_proxy-win.zip

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    needs: [build-mod, build-proxy-linux, build-proxy-windows, build-proxy-macos]

    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: last_release_notes.md
      - name: Download all workflow run artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: ncipollo/release-action@v1
        with:
          #draft: true
          artifacts: "*.zip"
          bodyFile: last_release_notes.md
